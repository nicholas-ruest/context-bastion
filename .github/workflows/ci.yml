name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  full-product:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: taiki-e/install-action@cargo-deny
      - run: cd frontend && npm ci && npx playwright install --with-deps chromium
      - name: Verify complete product
        run: scripts/verify-prototype.sh "$RUNNER_TEMP/context-bastion-evidence"
      - uses: actions/upload-artifact@v4
        with:
          name: context-bastion-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/context-bastion-evidence
          if-no-files-found: error
